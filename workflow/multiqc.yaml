# Name every sample after its file, so a run and a library each get one row.
# FastQC and fastp would otherwise name samples after the input FASTQs.
use_filename_as_sample_name: true
extra_fn_clean_exts:
  - type: remove
    pattern: ".raw"
  - type: remove
    pattern: ".trimmed"
  - ".umi_tools"
table_sample_merge:
  "R1": "_R1"
  "R2": "_R2"
module_order:
  - fastqc:
      name: "FastQC (raw)"
      anchor: fastqc_raw
      path_filters: ["*.raw_R?_fastqc.zip"]
  - fastp
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: fastqc_trimmed
      path_filters: ["*.trimmed_R?_fastqc.zip"]
  - star
  - samtools
  - umitools
# MultiQC draws a plot instead of a table past this many rows. The full sheet
# fills 1994: 527 runs, each with R1 and R2 rows, and 413 libraries.
max_table_rows: 5000
