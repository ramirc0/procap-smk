[workspace]
name = "procap-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
exclude-newer = "7d"

[dependencies]
python = "3.12.*"
polars = ">=1.43"
fastp = "==1.4.0"
star = "==2.7.11b"
samtools = "==1.24"
umi_tools = "==1.1.6"
fastqc = "==0.13.0"
multiqc = "==1.35"
pypints = "==1.2.1"
# PINTS calls numpy.cross on 2-D vectors, which numpy 2.5 removed.
numpy = "<2.5"
# figwig bam2bw's extras, from conda so pysam has one source.
numba = "*"
pysam = "*"
python-isal = "*"
pyfaidx = "*"
biopython = "*"
tqdm = "*"

[pypi-dependencies]
figwig = "==0.1.0"
deflate = ">=0.9"

[activation.env]
# PINTS and MultiQC import matplotlib. Without this, a job that inherits DISPLAY picks a GUI backend.
MPLBACKEND = "Agg"
# numpy madvises arrays of 4 MB or more for huge pages. On the fragmented SLURM nodes,
# each huge-page fault stalls in kernel compaction: reading chr1 and chr2 took 66 s, not 3 s.
NUMPY_MADVISE_HUGEPAGE = "0"

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
